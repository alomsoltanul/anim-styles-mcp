<!doctype html><meta charset="utf-8"><title>Black and White 3D</title>

<style>

.t{position:absolute;color:#fff;font:700 30px/1 Noto;letter-spacing:14px}
#a{left:0;right:0;text-align:center;top:600px}#b{left:44px;top:690px;font-size:24px;letter-spacing:9px}

<canvas id="v"></canvas><div class="t" id="a">RICKSHAW</div><div class="t" id="b">PRESENTS</div><div id="cap">The rickshaw flies.</div>

<script type="importmap">{"imports":{"three":"./_shared/vendor/three.module.min.js"}}</script>
<script type="module">
// Black and White 3D: pure black void, glossy white objects, hard light, a black mirror floor, tiny spaced type.
// The mirror is two passes: the whole world flipped under the floor, then a dark glass floor, then the world again.
import * as THREE from 'three';
import { RoomEnvironment } from './_shared/vendor/jsm/environments/RoomEnvironment.js';
import { rickshaw3d, softDisc } from './_shared/rick3d.js';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('v'), antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(W, H, false); r.autoClear = false; r.setClearColor(0x000000, 1); r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFShadowMap;
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(27, W / H, .1, 200), root = new THREE.Group(); scene.add(root);
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), .02).texture; scene.environmentIntensity = .34;
const key = new THREE.DirectionalLight('#ffffff', 3.4); key.position.set(-4, 9, 7); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -7, right: 7, top: 9, bottom: -3, far: 30 }); key.shadow.bias = -.0005; scene.add(key);
const rim = new THREE.DirectionalLight('#ffffff', 1.5); rim.position.set(6, 2, -6); scene.add(rim);
const white = new THREE.MeshStandardMaterial({ color: '#f4f4f4', roughness: .24, metalness: .05 }), black = new THREE.MeshStandardMaterial({ color: '#0d0d0f', roughness: .3 }), grey = new THREE.MeshStandardMaterial({ color: '#8d8d92', roughness: .3, metalness: .4 });
const dbl = m => { const c = m.clone(); c.side = THREE.DoubleSide; return c; };
let RKT, floor, balls = [], people = [], jets = [];
function statue(x, z) {
  const g = new THREE.Group(), cap = (rad, len, px, py, pz = 0) => { const m = new THREE.Mesh(new THREE.CapsuleGeometry(rad, len, 8, 20), white); m.position.set(px, py, pz); m.castShadow = true; g.add(m); return m; };
  cap(.045, .95, -.08, .55); cap(.045, .95, .08, .55); cap(.085, .72, 0, 1.5); const h = new THREE.Mesh(new THREE.SphereGeometry(.13, 28, 22), white); h.position.y = 2.2; g.add(h);
  const arm = d => { const p = new THREE.Group(); p.position.set(d * .11, 1.86, 0); const a = new THREE.Mesh(new THREE.CapsuleGeometry(.036, .92, 8, 16), white); a.position.y = -.5; p.add(a); for (let i = -1; i <= 1; i++) { const f = new THREE.Mesh(new THREE.CapsuleGeometry(.018, .17, 5, 10), white); f.position.set(i * .05, -1.1, 0); f.rotation.z = i * .3; p.add(f); } g.add(p); return p; };
  g.userData.arms = [arm(-1), arm(1)]; g.position.set(x, 0, z); root.add(g); return g;
}
async function setup() {
  RKT = rickshaw3d({ wedges: [dbl(white), dbl(black), dbl(white), dbl(black)], inner: dbl(black), cushion: black, box: white, saddle: black, metal: grey, tire: black, hub: white }, { wheelSeg: 56, tire: .075, spokes: 9, bevel: .03, tubeR: .03, tubeSeg: 12, hoodSeg: 14 });
  RKT.group.scale.setScalar(1.1); RKT.group.rotation.y = -.16; RKT.group.traverse(o => { if (o.isMesh) o.castShadow = o.receiveShadow = true; }); root.add(RKT.group);
  const sg = new THREE.SphereGeometry(1, 32, 24); for (let i = 0; i < 120; i++) { const b = new THREE.Mesh(sg, white); b.castShadow = b.receiveShadow = true; b.visible = false; root.add(b); balls.push(b); }
  people = [statue(-1.78, 1.2), statue(1.86, 1)];
  floor = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), new THREE.MeshBasicMaterial({ color: '#000', transparent: true, opacity: .56 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
  const jt = softDisc(128, [[0, 1], [.35, .55], [1, 0]]); RKT.jets.forEach(() => { const j = new THREE.Sprite(new THREE.SpriteMaterial({ map: jt, color: '#fff', transparent: true, opacity: .85, depthWrite: false })); RKT.group.add(j); jets.push(j); });
}
const $ = id => document.getElementById(id);
function draw(t) {
  const lift = BEAT.lift(t), ign = BEAT.ign(t), ch = BEAT.cheer(t), [sx, sy] = shakeXY(t, .025), G = RKT.group;
  G.position.set(sx - .02, .02 + lift * 2.1 + sy, 0); G.rotation.z = .03 * lift;
  RKT.wheels.forEach(w => { w.rotation.z = -t * 5 * ign; });
  jets.forEach((j, i) => { const p = RKT.jets[i], L = (.12 + .5 * ign) * (.9 + .2 * vnoise(t * 24 + i * 4)); j.position.set(p.x, p.y - L * 1.05, p.z); j.scale.set(.2, L * 2.4, 1); j.visible = ign > .03; });
  people.forEach((m, k) => m.userData.arms.forEach((a, i) => { a.rotation.z = (i ? 1 : -1) * (lerp(.12, 2.82, ch) + .08 * Math.sin(t * 7 + k) * ch); }));
  balls.forEach(b => b.visible = false);
  puffs(t, { n: 120, t1: 4.9, life: [1.8, 4.2], spread: 3.3, rise: -.35, fall: -2.2, r: [.09, .3], emit: (i, b) => { const j = RKT.jets[i % 3]; return [j.x * 1.1, .12 + BEAT.lift(b) * 2.1]; } }).forEach((p, k) => { const b = balls[k]; b.visible = true; b.position.set(p.x, Math.max(p.r, p.y), lerp(-1.1, 1.5, hash(p.i * 1.3))); b.scale.setScalar(p.r); });
  cam.position.set(.05 + vnoise(t * .4) * .03, 1.05, lerp(16.6, 15.8, t / DUR)); cam.lookAt(0, 1.62 + lift * .42, 0);
  // pass 1: world flipped under the floor; pass 2: dark glass, then the world
  r.clear(); root.scale.y = -1; floor.visible = false; r.render(scene, cam);
  r.clearDepth(); root.scale.y = 1; floor.visible = true; r.render(scene, cam);
  $('a').style.transform = `translateY(${-lift * 212}px)`; $('a').style.opacity = 1 - ss(4.3, 4.7, t); $('b').style.opacity = 1 - ss(2, 2.4, t);
  $('cap').style.opacity = BEAT.caption(t);
}
boot({ dur: 7, cues: LIFT_CUES, setup, draw, fonts: ['700 30px Noto', '600 56px Noto'] });
</script>
