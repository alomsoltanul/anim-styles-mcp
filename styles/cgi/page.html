<script type="module">
// CGI Motion: filmic tone map + bloom, dark towers, under-lit subject, ground light ring, rolling fog, big two-tone captions.
import * as THREE from 'three';
import { EffectComposer } from './_shared/vendor/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from './_shared/vendor/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from './_shared/vendor/jsm/postprocessing/UnrealBloomPass.js';
import { OutputPass } from './_shared/vendor/jsm/postprocessing/OutputPass.js';
import { RoomEnvironment } from './_shared/vendor/jsm/environments/RoomEnvironment.js';
import { rickshaw3d, softDisc, gradientTex } from './_shared/rick3d.js';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('v'), antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(W, H, false); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(34, W / H, .1, 400);
scene.background = gradientTex([[0, '#59655f'], [.2, '#7c8a82'], [.36, '#aab4a4'], [.5, '#3a4148'], [1, '#0c0f14']]);

composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), .34, .7, .9); composer.addPass(bloom); composer.addPass(new OutputPass());
let RKT, fog = [], jets = [], under, pool, flare, ringGlow, rim;
const gr = document.getElementById('gr').getContext('2d'); let noise;
async function setup() {
  noise = gr.createImageData(540, 960); const Q = rand(4); for (let i = 0; i < 540 * 960; i++) { const v = Q() * 255; noise.data[i * 4] = noise.data[i * 4 + 1] = noise.data[i * 4 + 2] = v; noise.data[i * 4 + 3] = 255; }
  const winT = k => { const c = document.createElement('canvas'); c.width = 512; c.height = 1024; const x = c.getContext('2d'), R = rand(k); x.fillStyle = '#000'; x.fillRect(0, 0, 512, 1024); for (let y = 3; y < 1024; y += 9) for (let X = 3; X < 512; X += 6) { const v = R(); if (v > .6) { x.fillStyle = v > .985 ? '#ffe2a8' : v > .9 ? '#8a6a3c' : v > .78 ? '#3e4e62' : '#242a34'; x.fillRect(X, y, 3, 5); } } const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
  const T = [winT(3), winT(8)];
  const tower = (x, z, w, h, k) => { const m = new THREE.MeshStandardMaterial({ color: '#0a0c11', roughness: .6, metalness: .3, emissive: '#ffffff', emissiveMap: T[k], emissiveIntensity: .95 }); const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, 8), m); b.position.set(x, h / 2, z); scene.add(b); };
  [[-13, -30, 15, 14, 0], [1.5, -36, 11, 10.5, 1], [13, -30, 14, 15.5, 0], [-27, -34, 13, 18, 1], [27, -34, 14, 12, 1]].forEach(a => tower(...a));
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: '#0b0e13', roughness: .34, metalness: .75 })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(4.6, .035, 12, 200), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.7, 3.2, 4.2), fog: false })); ring.rotation.x = Math.PI / 2; ring.position.y = .06; scene.add(ring);
  const disc = softDisc(256, [[0, 1], [.25, .55], [.6, .14], [1, 0]]), add = (c, o = 1) => new THREE.SpriteMaterial({ map: disc, color: c, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
  ringGlow = new THREE.Mesh(new THREE.RingGeometry(4.2, 5, 128), new THREE.MeshBasicMaterial({ color: '#6fc7ff', transparent: true, opacity: .16, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false })); ringGlow.rotation.x = -Math.PI / 2; ringGlow.position.y = .05; scene.add(ringGlow);
  pool = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: disc, color: '#ffbf80', transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, fog: false })); pool.rotation.x = -Math.PI / 2; pool.position.set(0, .07, 1); scene.add(pool);
  flare = new THREE.Sprite(add('#ffd9a8', 0)); scene.add(flare);
  const horizon = new THREE.Sprite(add('#ffe9c8', .34)); horizon.position.set(4, 11, -30); horizon.scale.set(40, 14, 1); scene.add(horizon);

  RKT = rickshaw3d({ wedges: ['#7a0d14', '#4a0a12', '#7a0d14', '#4a0a12'].map(c => P(c, { side: THREE.DoubleSide })), cushion: P('#16161c'), box: P('#8a0f18'), saddle: P('#101014'), metal: P('#3a3e46', { metalness: .9, roughness: .25 }), tire: new THREE.MeshStandardMaterial({ color: '#08080a', roughness: .6 }), hub: P('#50545c', { metalness: .95 }) }, { wheelSeg: 56, tire: .06, spokes: 12, bevel: .02, tubeR: .028, tubeSeg: 12, hoodSeg: 12 });
  RKT.group.scale.setScalar(1.2); RKT.group.rotation.y = -.1; scene.add(RKT.group);
  under = new THREE.PointLight('#ffb070', 0, 22, 1.6); scene.add(under);
  rim = new THREE.SpotLight('#ff5a4a', 520, 40, .7, .6, 1.4); rim.position.set(-5, 9, -9); rim.target = RKT.group; scene.add(rim, rim.target);
  const k = new THREE.DirectionalLight('#9fc0d8', .7); k.position.set(4, 7, 9); scene.add(k);
  const soft = softDisc(256, [[0, .55], [.5, .28], [1, 0]]);
  for (let i = 0; i < 46; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: soft, color: '#a9bccb', transparent: true, depthWrite: false, fog: false })); s.visible = false; scene.add(s); fog.push(s); }
  const jetT = softDisc(128, [[0, 1], [.35, .6], [1, 0]]); RKT.jets.forEach(() => { const j = new THREE.Sprite(new THREE.SpriteMaterial({ map: jetT, color: new THREE.Color(2.6, 1.7, 1), transparent: true, opacity: .75, blending: THREE.AdditiveBlending, depthWrite: false, fog: false })); RKT.group.add(j); jets.push(j); });
}
const A = document.getElementById('a'), B = document.getElementById('b');
function draw(t) {
  const lift = BEAT.lift(t), ign = BEAT.ign(t), [sx, sy] = shakeXY(t, .05), G = RKT.group;
  G.position.set(sx - .1, .02 + lift * 2.7 + sy, 0); G.rotation.z = .035 * lift * Math.sin(t * 1.5);
  RKT.wheels.forEach(w => { w.rotation.z = -t * 6 * ign; });
  jets.forEach((j, i) => { const p = RKT.jets[i], L = (.15 + .4 * ign) * (.9 + .2 * vnoise(t * 25 + i * 5)); j.position.set(p.x, p.y - L * 1.5, p.z); j.scale.set(.42, L * 3.6, 1); j.visible = ign > .03; });
  under.position.set(G.position.x + .3, G.position.y - .25, 1); under.intensity = 46 * ign;
  pool.scale.set(7 * ign + .01, 15 * ign + .01, 1); pool.material.opacity = .42 * ign;
  flare.position.set(G.position.x + .3, G.position.y - .3, 1.6); flare.scale.set(5, 1.5, 1); flare.material.opacity = .32 * ign;
  ringGlow.material.opacity = .1 + .22 * ign;
  fog.forEach(s => s.visible = false);

  cam.position.set(.1 + vnoise(t * .5) * .06, 1.9 + lift * .4, lerp(15.2, 13.8, t / DUR)); cam.lookAt(0, 3 + lift * .5, 0);
  composer.render();
  gr.putImageData(noise, -Math.floor(hash(Math.floor(t * 24)) * 40), 0);
  A.style.opacity = 1 - ss(2.6, 3, t);
  const q = ss(4.6, 4.9, t); B.style.opacity = q; B.style.transform = `scale(${lerp(.9, 1, backOut(q))})`;
}
boot({ dur: 7, cues: LIFT_CUES, setup, draw, fonts: ['900 84px Noto'] });
</script>
