<!doctype html><meta charset="utf-8"><title>Sacred Line Art</title>
<link rel="stylesheet" href="_shared/page.css">
<canvas id="c" width="1080" height="1920"></canvas>
<script src="_shared/common.js"></script>
<script>
// Line art on pure black: hairlines, node dots, faint geometry circles, stick figures, a lollipop crowd. White only.
const c = document.getElementById('c').getContext('2d');
const S = 2.05, OX = 530, GROUND = 1200, RISE = 400;
const line = (pts, w = 2, a = 1, closed) => { c.strokeStyle = `rgba(255,255,255,${a})`; c.lineWidth = w; c.lineCap = 'round'; c.lineJoin = 'round'; trace(c, pts, closed); c.stroke(); };
const ring = (x, y, r, w = 1, a = .2) => { c.strokeStyle = `rgba(255,255,255,${a})`; c.lineWidth = w; c.beginPath(); c.arc(x, y, r, 0, 7); c.stroke(); };
const node = (x, y, r = 5, a = 1) => { c.fillStyle = `rgba(255,255,255,${a})`; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); };
function draw(t) {
  const lift = BEAT.lift(t), ign = BEAT.ign(t), ch = BEAT.cheer(t), [sx, sy] = shakeXY(t, 3), ox = OX + sx, oy = GROUND - lift * RISE + sy, gy = GROUND + lift * 90, P = p => place(p, ox, oy, S);
  c.fillStyle = '#000'; c.fillRect(0, 0, W, H);
  // geometry behind everything
  const cx = 540, cy = 760 - lift * 70, R = 250, rot = t * .05;
  ring(cx, cy, R, 1.2, .24); for (let i = 0; i < 6; i++) ring(cx + Math.cos(rot + i * 1.047) * R, cy + Math.sin(rot + i * 1.047) * R, R, 1.2, .19);
  ring(cx, cy + 120, 560, 1.2, .18); ring(cx, cy, R * 2, 1.2, .15);
  // ground
  line([[50, gy], [1030, gy]], 1.5, .55);
  // hairlines and thrust rings
  RK.wheels.forEach((w, i) => { const q = placeWheel(w, ox, oy, S);
    line([[q.x, q.y + q.r], [q.x, gy]], 1, .45 * ign + .08);
    for (let k = 0; k < 4; k++) { const u = (t * .9 + k / 4 + i * .13) % 1; ring(q.x, q.y + q.r + u * 170 * ign, 20 + u * 86, 1, (1 - u) * .45 * ign); }
    ring(q.x, q.y, q.r, 2, 1); ring(q.x, q.y, q.r * .46, 1, .7); node(q.x, q.y, 4);
    const a = t * 3 * ign + i; for (let k = 0; k < 6; k++) line([[q.x, q.y], [q.x + Math.cos(a + k * 1.047) * q.r, q.y + Math.sin(a + k * 1.047) * q.r]], 1, .35); });
  // wire rickshaw with a node at every joint
  const arc = P(RK.hoodArc), piv = P([RK.pivot])[0];
  line(arc, 2.2, 1); line(P(RK.hood.slice(-3)), 2, 1); P(RK.cushion) && line(P(RK.cushion), 2, 1, true); line(P(RK.box), 2, 1, true); line(P(RK.saddle), 2, 1, true);
  for (let i = 0; i <= 22; i += 2) line([piv, arc[i]], 1, .4);
  const inner = arcPts(RK.pivot[0], RK.pivot[1], 44, 68, 172, 28, 11), inP = P(inner); line(inP, 1, .5);
  RK.frame.forEach(l => { const q = P(l); line(q, 2, 1); node(...q[0]); node(...q[1]); });
  for (let i = 0; i <= 22; i += 2) node(...arc[i], 4.4);
  [...P(RK.cushion), ...P(RK.box)].forEach(p => node(...p, 4.4)); node(...piv, 5);
  // small orbiters
  [[.0, 300], [2.1, 390], [4.2, 340]].forEach(([a, r], i) => { const x = ox + Math.cos(a + t * .5) * r, y = oy - 90 + Math.sin(a + t * .5) * r * .8; ring(x, y, 11, 1, .5); node(x, y, 2.5, .8); });
  // stick figure
  const fx = 110, fy = gy; line([[fx, fy - 118], [fx, fy - 52]], 2); line([[fx - 24, fy], [fx, fy - 52], [fx + 24, fy]], 2);
  [-1, 1].forEach(d => line([[fx, fy - 100], [fx + d * 34, fy - 100 + lerp(46, -56, ch)]], 2)); node(fx, fy - 136, 17);
  // crowd
  [[1470, 6, 62], [1610, 9, 84], [1770, 13, 110]].forEach(([y, r, st], row) => { for (let i = 0; i < 11; i++) { const x = 62 + i * 96 + (row % 2) * 40 + hash(i + row * 9) * 18, b = ch * Math.abs(Math.sin(t * 5 + i * 1.3 + row)) * 24, yy = y + lift * 40 - b + hash(i * 3 + row) * 14; line([[x, yy], [x, yy + st]], 1.4, .85); node(x, yy, r); } });
  c.font = '300 64px Noto'; c.textAlign = 'center'; c.textBaseline = 'middle';
  const hk = BEAT.hook(t); if (hk > 0) { c.fillStyle = `rgba(255,255,255,${hk})`; TXT.whatLines.forEach((s, i) => c.fillText(s, 540, 300 + i * 92)); }
  const cp = BEAT.caption(t); if (cp > 0) { c.fillStyle = `rgba(255,255,255,${cp})`; c.fillText(TXT.fly, 540, 300); }
}
boot({ dur: 7, cues: LIFT_CUES, draw, fonts: ['300 64px Noto'] });
</script>
