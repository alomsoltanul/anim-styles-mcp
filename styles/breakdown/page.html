<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Kanji exploded view</title>
<link rel="stylesheet" href="./_shared/base.css">
<style>
html,body{background:#0b1113}
#bg{position:absolute;inset:0;background:radial-gradient(900px 1100px at 42% 46%,#1b2e31 0%,#111c1e 46%,#0a0f11 100%)}
#gl{position:absolute;inset:0;width:1080px;height:1920px}
#lead{position:absolute;inset:0}
#head{position:absolute;left:72px;top:262px;font:500 29px/1 Menlo,ui-monospace,Consolas,monospace;letter-spacing:5px;color:#fff}
#head b{font:700 34px/1 'Jp';letter-spacing:0;margin-right:10px}
#head span{color:#7d8c8e}
.call{position:absolute;left:716px;width:330px;color:#fff}
.call i{display:block;font:500 25px/1 Menlo,ui-monospace,Consolas,monospace;font-style:normal;color:#F0654F;letter-spacing:2px;margin-bottom:10px}
.call b{display:block;font:700 46px/1.25 'Bn'}
.call b em{font:700 46px/1.25 'Jp';font-style:normal;margin-right:12px}
.call small{display:block;font:400 28px/1.3 'Bn';color:#8d9b9d;margin-top:4px}
#cap{position:absolute;left:60px;right:60px;top:1500px;text-align:center;color:#fff;font:600 56px/1.35 'Bn'}
#cap em{font:700 56px/1.35 'Jp';font-style:normal}
#res{position:absolute;left:0;right:0;top:1270px;text-align:center;color:#fff}
#res .a{font:700 92px/1.2 'Jp'}
#res .a ruby rt{font:500 34px/1 'Jp';color:#9fb0b2;letter-spacing:4px}
#res .b{font:600 62px/1.3 'Bn';color:#F0654F;margin-top:4px}
</style></head>
<body><div id="stage"><div id="bg"></div><canvas id="gl" width="1080" height="1920"></canvas>
<svg id="lead" width="1080" height="1920"></svg>
<div id="head"><b>働</b>/ <span>EXPLODED VIEW</span></div>
<div id="calls"></div><div id="cap"></div>
<div id="res"><div class="a"><ruby>働<rt>はたら</rt></ruby>く</div><div class="b">to work</div></div>
</div>
<script type="module">
import * as THREE from './_shared/vendor/three.module.min.js';
import { clamp, seg, lerp, ease, capState, fontsReady } from './_shared/time.js';
import { STROKES } from './strokes.js';
const DUR = 14.8, $ = id => document.getElementById(id);
const S = 3, RAD = .22, TH = .07;                     // plate side, corner radius, thickness (world units)
const PARTS = [                                        // top to bottom. 亻+重+力 is the memory trick; 働 = 亻 + 動 and 動 holds 重 and 力.
  { n: '01', k: '亻', name: 'Person', sub: '2 strokes', tint: 0xF0654F, at: 3.1 },
  { n: '02', k: '重', name: 'Heavy', sub: '9 strokes', tint: 0xFFD640, at: 4.1 },
  { n: '03', k: '力', name: 'Power', sub: '2 strokes', tint: 0x62D2C3, at: 5.1 },
  { n: '04', k: '', name: '13 strokes', sub: 'One kanji', tint: 0xffffff, at: 6.1 },
];
const CAPS = [
  [-1, 2.7, 'Let\'s open up the kanji <em>働</em>.'],
  [6.6, 9.0, 'A person lifts a heavy load.'],
  [10.5, 12.1, 'That is work.'],
  [12.15, 14.5, 'This kanji was made in Japan.'],
];
const EX0 = 1.3, EX1 = 3.0, CL0 = 9.0, CL1 = 10.3, GAP = 1.92;
const CUES = [{ t: EX0, k: 'whoosh', i: 0 }, ...PARTS.map(p => ({ t: p.at, k: 'tick' })), { t: CL0, k: 'whoosh', i: 1 }, { t: CL1 - .05, k: 'drop' }, { t: 12.2, k: 'drip' }];

// Each part is drawn from its own KanjiVG strokes, so it keeps its true place inside the square.
function glyphParts() {
  return STROKES.map(list => {
    const k = document.createElement('canvas'); k.width = k.height = 1024; const x = k.getContext('2d'), u = 1024 / 109;
    x.scale(u, u); x.strokeStyle = '#fff'; x.lineWidth = 6.4; x.lineCap = 'round'; x.lineJoin = 'round';
    list.forEach(d => x.stroke(new Path2D(d)));
    return k;
  });
}
function rounded(s, r) {
  const h = s / 2, p = new THREE.Shape();
  p.moveTo(-h + r, -h); p.lineTo(h - r, -h); p.absarc(h - r, -h + r, r, -Math.PI / 2, 0); p.lineTo(h, h - r); p.absarc(h - r, h - r, r, 0, Math.PI / 2);
  p.lineTo(-h + r, h); p.absarc(-h + r, h - r, r, Math.PI / 2, Math.PI); p.lineTo(-h, -h + r); p.absarc(-h + r, -h + r, r, Math.PI, Math.PI * 1.5);
  return p;
}
function gridTexture() {                               // the writing square: 田 guide lines, as in a practice sheet
  const k = document.createElement('canvas'); k.width = k.height = 1024; const x = k.getContext('2d');
  x.strokeStyle = 'rgba(255,255,255,.34)'; x.lineWidth = 5; x.setLineDash([22, 18]);
  x.beginPath(); x.moveTo(512, 40); x.lineTo(512, 984); x.moveTo(40, 512); x.lineTo(984, 512); x.stroke();
  return k;
}

let R, scene, cam, plates = [], glyphMats = [], root;
function build() {
  R = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, alpha: true, preserveDrawingBuffer: true });
  R.setPixelRatio(2); R.setSize(1080, 1920, false); R.setClearColor(0, 0); R.outputColorSpace = THREE.SRGBColorSpace;
  scene = new THREE.Scene(); root = new THREE.Group(); scene.add(root);
  const H = 14.5, Wd = H * 1080 / 1920; cam = new THREE.OrthographicCamera(-Wd / 2, Wd / 2, H / 2, -H / 2, .1, 100);
  scene.add(new THREE.HemisphereLight(0xdff2f2, 0x0a1214, 1.3));
  const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(4, 10, 3); scene.add(d);
  const tex = glyphParts(), body = new THREE.ExtrudeGeometry(rounded(S, RAD), { depth: TH, bevelEnabled: true, bevelSize: .012, bevelThickness: .012, bevelSegments: 2, curveSegments: 12 });
  const ring = rounded(S + .012, RAD); ring.holes.push(new THREE.Path(rounded(S - .022, RAD - .01).getPoints(14).reverse()));
  const ringG = new THREE.ShapeGeometry(ring, 14), flat = new THREE.PlaneGeometry(S, S);
  PARTS.forEach((p, i) => {
    const g = new THREE.Group(); root.add(g);
    const base = i === 3;
    const m = new THREE.Mesh(body, new THREE.MeshPhysicalMaterial({ color: base ? 0x37474a : 0x2c4044, metalness: .1, roughness: .32, clearcoat: 1, clearcoatRoughness: .25, transparent: true, opacity: base ? .96 : .34, depthWrite: base }));
    m.rotation.x = -Math.PI / 2; m.position.y = -TH; g.add(m);
    const e = new THREE.Mesh(ringG, new THREE.MeshBasicMaterial({ color: 0xcfe3e3, transparent: true, opacity: .55 }));
    e.rotation.x = -Math.PI / 2; e.position.y = .022; g.add(e);
    const ct = new THREE.CanvasTexture(base ? gridTexture() : tex[i]); ct.colorSpace = THREE.SRGBColorSpace; ct.anisotropy = 8;
    const gm = new THREE.MeshBasicMaterial({ map: ct, transparent: true, depthWrite: false, color: 0xffffff });
    const q = new THREE.Mesh(flat, gm); q.rotation.x = -Math.PI / 2; q.position.y = .03; q.renderOrder = 5 + (3 - i); g.add(q);
    glyphMats.push(gm); plates.push(g);
  });
  // Calls
  PARTS.forEach((p, i) => { const d = document.createElement('div'); d.className = 'call'; d.id = 'call' + i; d.innerHTML = `<i>${p.n}</i><b>${p.k ? `<em>${p.k}</em>` : ''}${p.name}</b><small>${p.sub}</small>`; $('calls').appendChild(d); });
  const svg = $('lead'); PARTS.forEach((p, i) => svg.insertAdjacentHTML('beforeend', `<polyline id="ln${i}" fill="none" stroke="#a9bcbd" stroke-width="1.6"/><circle id="dt${i}" r="6" fill="#F0654F"/>`));
}
const v = new THREE.Vector3();
const toScreen = o => { v.copy(o).project(cam); return [(v.x + 1) / 2 * 1080, (1 - v.y) / 2 * 1920]; };
const P109 = (x, y) => [(x / 109 - .5) * S, (y / 109 - .5) * S];
const anchorLocal = [P109(22, 62), P109(62, 46), P109(95, 58), [1.32, .95]];   // on the ink of each part, then a corner of the base

function draw(t) {
  const ex = ease.io(seg(t, EX0, EX1)) * (1 - ease.io(seg(t, CL0, CL1)));
  const top = ease.io(seg(t, CL0 - .15, CL1 + .1));   // 0 = isometric, 1 = straight down onto the finished kanji
  const az = lerp(.785 + .1 * Math.sin(t * .42), 0, top), el = lerp(.615, 1.5605, top), Rr = 30;
  const exS = ease.io(seg(t, EX0, EX1));
  const cy = lerp(exS * 2.9, 0, top);                  // aim point follows the stack as it opens
  cam.position.set(Math.sin(az) * Math.cos(el) * Rr, cy + Math.sin(el) * Rr, Math.cos(az) * Math.cos(el) * Rr);
  cam.up.set(0, 1, 0); cam.lookAt(0, cy, 0);
  cam.zoom = lerp(lerp(1.28, 1, ease.io(seg(t, EX0, EX1))), 1.92, top);
  cam.setViewOffset(1080, 1920, lerp(exS * 150, 0, top), lerp(lerp(150, -36, exS), 240, top), 1080, 1920); cam.updateProjectionMatrix();
  plates.forEach((g, i) => { g.position.y = (3 - i) * GAP * ex + (3 - i) * .012; });
  const on = i => seg(t, PARTS[i].at, PARTS[i].at + .3) * (1 - seg(t, CL0 - .1, CL0 + .25));
  plates.forEach((g, i) => {
    if (i < 3) glyphMats[i].color.copy(new THREE.Color(0xffffff).lerp(new THREE.Color(PARTS[i].tint), seg(t, PARTS[i].at, PARTS[i].at + .3)));   // the colour stays, so the finished kanji still shows its parts
    glyphMats[i].opacity = 1;
  });
  R.render(scene, cam);
  PARTS.forEach((p, i) => {
    const y = 468 + i * 268, k = on(i), el2 = $('call' + i); el2.style.top = y + 'px'; el2.style.opacity = k; el2.style.transform = `translateX(${(1 - ease.out(k)) * 26}px)`;
    const [ax, ay] = toScreen(new THREE.Vector3(anchorLocal[i][0], plates[i].position.y + .04, anchorLocal[i][1]));
    const ex2 = 672, ey = y + 44, mid = lerp(ax, ex2, .62), d = ease.out(seg(t, p.at - .05, p.at + .32)), ln = $('ln' + i), dt = $('dt' + i);
    const pts = [[ax, ay], [mid, ey], [ex2, ey]], tot = Math.hypot(mid - ax, ey - ay) + (ex2 - mid), L = tot * d, seg1 = Math.hypot(mid - ax, ey - ay);
    const out = [pts[0]]; if (L <= seg1) { const f = seg1 ? L / seg1 : 0; out.push([lerp(ax, mid, f), lerp(ay, ey, f)]); } else { out.push(pts[1]); out.push([lerp(mid, ex2, (L - seg1) / (ex2 - mid)), ey]); }
    ln.setAttribute('points', out.map(q => q.join(',')).join(' ')); ln.style.opacity = k > 0 ? Math.min(1, k * 2) : 0;
    dt.setAttribute('cx', ax); dt.setAttribute('cy', ay); dt.style.opacity = k;
  });
  const cap = $('cap'); cap.style.opacity = 0;
  for (const [a, b, h] of CAPS) if (t >= a && t <= b) { const s = capState(t, a, b); cap.innerHTML = h; cap.style.opacity = s.o; cap.style.transform = `translateY(${s.y}px)`; }
  const r = ease.out(seg(t, CL1 + .05, CL1 + .5)); $('res').style.opacity = r; $('res').style.transform = `translateY(${(1 - r) * 20}px)`;
  $('head').style.opacity = 1 - seg(t, CL0, CL0 + .3);
  $('stage').style.opacity = 1 - seg(t, DUR - .4, DUR);
}
window.prepare = async () => { await fontsReady(["700 900px Jp", "600 56px Bn", "700 46px Bn", "400 28px Bn"]); build(); draw(0); return { dur: DUR, cues: CUES }; };
window.seek = draw; window.CUES = CUES;
if (!location.search.includes('render')) { window.prepare().then(() => { const s = performance.now(); (function f() { draw(((performance.now() - s) / 1000) % DUR); requestAnimationFrame(f); })(); }); }
</script></body></html>
