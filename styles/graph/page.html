<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Count-up Graph</title>
<link rel="stylesheet" href="./_shared/base.css">
<style>
html,body{background:#fff}
canvas{position:absolute;inset:0}
#label{position:absolute;left:84px;top:300px;color:#6b7280;font:500 40px/1.3 'Bn'}
#num{position:absolute;left:78px;top:352px;color:#14161B;font:700 176px/1.15 'Bn';letter-spacing:-2px}
#hook{position:absolute;left:84px;right:84px;top:1500px;color:#14161B;font:600 58px/1.35 'Bn'}
#note{position:absolute;left:84px;right:84px;top:1718px;color:#8a919c;font:400 27px/1.3 'Bn'}
#pill{position:absolute;left:0;top:0;padding:8px 22px 10px;border-radius:40px;color:#fff;font:700 38px/1.1 'In','Bn';white-space:pre;transform-origin:50% 100%}
</style></head>
<body><div id="stage"><canvas id="c" width="1080" height="1920"></canvas>
<div id="label">Words you need</div><div id="num">0</div><div id="pill"></div><div id="hook"></div>
<div id="note">Rough estimates. JLPT has no official word list.</div></div>
<script type="module">
import { clamp, seg, lerp, ease, comma, capState, fontsReady } from './_shared/time.js';
const DUR = 13.5, g = document.getElementById('c').getContext('2d'), $ = id => document.getElementById(id);
// Commonly cited cumulative word counts per level; estimates, stated as such on screen. One colour per level.
const L = [
  { n: 'N5', v: 800, c: '#2A9D8F' }, { n: 'N4', v: 1500, c: '#F4A261' }, { n: 'N3', v: 3750, c: '#E63946' },
  { n: 'N2', v: 6000, c: '#1D3557' }, { n: 'N1', v: 10000, c: '#6B21A8' },
];
const X0 = 96, X1 = 984, Y0 = 1330, Y1 = 690, VMAX = 10000;
const px = i => X0 + (i + 1) / 5 * (X1 - X0), py = v => lerp(Y0, Y1, v / VMAX);
// Monotone curve through (start, N5 … N1), sampled once into a dense polyline.
const P = [{ x: X0, y: Y0, v: 0 }, ...L.map((l, i) => ({ x: px(i), y: py(l.v), v: l.v }))];
const m = P.map((p, i) => { const a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)]; return (b.y - a.y) / (b.x - a.x); });
const LINE = [];
for (let i = 0; i < P.length - 1; i++) {
  const a = P[i], b = P[i + 1], h = b.x - a.x;
  for (let k = 0; k < 60; k++) {
    const u = k / 60, u2 = u * u, u3 = u2 * u;
    const y = (2 * u3 - 3 * u2 + 1) * a.y + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * b.y + (u3 - u2) * h * m[i + 1];
    LINE.push({ x: a.x + h * u, y, v: lerp(a.v, b.v, u) });
  }
}
LINE.push({ ...P.at(-1) });
const T0 = 1.0, STEP = 1.32, TEND = T0 + STEP * 5;    // one level every 1.32 s
const stopAt = i => T0 + STEP * (i + 1);
function progress(t) {                                 // position along the line: eases into each level, a beat at each stop
  const q = clamp((t - T0) / STEP, 0, 5), i = Math.floor(q), f = q - i;
  return Math.min(5, i + ease.io(clamp(f / .82)));
}
const LINES = [
  [-1, TEND - .1, 'How many words, N5 to N1?'],
  [TEND + .35, 11.0, 'At 10 words a day: 1,000 days.'],
  [11.2, DUR - .15, 'So let\'s get started.'],
];
const CUES = [{ t: T0, k: 'digits' }];
L.forEach((l, i) => { CUES.push({ t: stopAt(i) - .3, k: 'tick' }); if (i < 4) CUES.push({ t: stopAt(i) - .02, k: 'digit' }); });
CUES.push({ t: stopAt(4) - .25, k: 'drop' }, { t: TEND + .35, k: 'whoosh', i: 0 }, { t: 11.2, k: 'drip' });

function draw(t) {
  g.clearRect(0, 0, 1080, 1920); g.fillStyle = '#fff'; g.fillRect(0, 0, 1080, 1920);
  const q = progress(t), idx = q * 60, n = Math.floor(idx), f = idx - n;
  const a = LINE[Math.min(n, LINE.length - 1)], b = LINE[Math.min(n + 1, LINE.length - 1)];
  const tip = { x: lerp(a.x, b.x, f), y: lerp(a.y, b.y, f), v: lerp(a.v, b.v, f) };
  // Axis and level stops
  g.strokeStyle = '#d7dae0'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(X0, Y0); g.lineTo(X1, Y0); g.stroke();
  g.font = "600 34px 'In'"; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  L.forEach((l, i) => {
    const on = seg(t, stopAt(i) - .35, stopAt(i) - .1);
    g.strokeStyle = '#e8eaee'; g.lineWidth = 2; g.setLineDash([5, 9]);
    g.beginPath(); g.moveTo(px(i), Y0); g.lineTo(px(i), lerp(Y0, py(l.v), on)); g.stroke(); g.setLineDash([]);
    g.fillStyle = on > .5 ? l.c : '#b6bbc4'; g.fillText(l.n, Math.min(px(i), X1 - 26), Y0 + 56);
  });
  // The drawn part of the curve, then a dot on each level passed and one on the tip.
  g.strokeStyle = '#14161B'; g.lineWidth = 7; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath();
  g.moveTo(LINE[0].x, LINE[0].y); for (let i = 1; i <= Math.min(n, LINE.length - 1); i++) g.lineTo(LINE[i].x, LINE[i].y); g.lineTo(tip.x, tip.y); g.stroke();
  L.forEach((l, i) => { const on = seg(t, stopAt(i) - .3, stopAt(i) - .08); if (on > 0) { g.fillStyle = l.c; g.beginPath(); g.arc(px(i), py(l.v), 13 * ease.back(on), 0, 6.283); g.fill(); } });
  g.fillStyle = '#14161B'; g.beginPath(); g.arc(tip.x, tip.y, 13, 0, 6.283); g.fill();

  // Rolling number + level pill that rides above the tip
  const held = LINE[Math.min(Math.round(progress(Math.round(t * 30) / 30) * 60), LINE.length - 1)].v;   // read at frame time, so the digits hold still across the blur samples
  $('num').textContent = comma(Math.round(held / 10) * 10);
  const lev = L[clamp(Math.floor(q - .15), 0, 4)], pill = $('pill'), vis = seg(t, stopAt(0) - .35, stopAt(0) - .1) * (1 - seg(t, TEND + .1, TEND + .4));
  pill.textContent = `${lev.n}   ${comma(lev.v)}`; pill.style.background = lev.c; pill.style.color = lev.n === 'N4' ? '#14161B' : '#fff'; pill.style.opacity = vis;   // white on the N4 orange is too faint
  const w = pill.offsetWidth, h = pill.offsetHeight, x = clamp(tip.x - w / 2, 40, 1040 - w);
  pill.style.transform = `translate(${x}px,${tip.y - h - 30}px)`;
  const hook = $('hook'); hook.style.opacity = 0;
  for (const [a2, b2, txt] of LINES) if (t >= a2 && t <= b2) { const s = capState(t, a2, b2); hook.textContent = txt; hook.style.opacity = s.o; hook.style.transform = `translateY(${s.y}px)`; }
  $('note').style.opacity = seg(t, .4, .9);
  $('stage').style.opacity = 1 - seg(t, DUR - .4, DUR);
}
window.prepare = async () => { await fontsReady(["700 176px Bn", "600 58px Bn", "700 38px In"]); draw(0); return { dur: DUR, cues: CUES }; };
window.seek = draw; window.CUES = CUES;
if (!location.search.includes('render')) { window.prepare().then(() => { const s = performance.now(); (function f() { draw(((performance.now() - s) / 1000) % DUR); requestAnimationFrame(f); })(); }); }
</script></body></html>
