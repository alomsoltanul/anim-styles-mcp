<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paper-cut fact reel</title>
<link rel="stylesheet" href="./_shared/page.css">
<style>
html,body{margin:0;background:#000;height:100%}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{height:100vh;width:auto;max-width:100vw;display:block}
body.render{display:block}
body.render canvas{width:1080px;height:1920px;max-width:none}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="./_shared/paper/pace.js"></script>
<script src="./_shared/paper/paper.js"></script>
<script>
'use strict';
// How long is a billion seconds? All three answers are plain division: 86,400 seconds in a day, 31,557,600 in a year of 365.25 days.
const { x, ART, piece, poly, circ, rect, sheet, tape, T, big, icon, num, CX, CARD, CARD2, RED, GOLD, INK, MUTE, SKY, clamp, lerp, easeOut, hash } = PAPER;
const pop = (since, at, len = .3) => easeOut(clamp((since - at) / len));     // short arrival, then it stays put while the text is read

// One cut-paper tile that fills like a progress bar. fill 0..1.
function tile(cx, cy, w, h, fill, seed, on = RED) {
  piece(() => rect(cx, cy, w, h, 0, seed, 2), CARD, 4);
  if (fill > 0) piece(() => rect(cx - w * (1 - fill) / 2, cy, w * fill, h, 0, seed + 1, 2), on, 2);
}

// Hook: a stopwatch, its hand stepping once a second.
function stopwatch(g) {
  const cx = ART.cx, cy = ART.cy + 30, r = 262;
  piece(() => rect(cx, cy - r - 44, 96, 62, 0, 4), INK, 8);
  piece(() => circ(cx, cy, r + 26, 2, 40), INK, 16);
  piece(() => circ(cx, cy, r, 3, 40), CARD, 5);
  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6, q = r - 34; piece(() => rect(cx + q * Math.sin(a), cy - q * Math.cos(a), i % 3 ? 8 : 14, i % 3 ? 28 : 44, a, i, 1), i % 3 ? MUTE : INK, 1); }
  const a = Math.floor(g.t * 2) / 2 * 2 * Math.PI / 6;                        // two steps a second, so frame 0 is already moving
  x.save(); x.translate(cx, cy); x.rotate(a); piece(() => poly([[-9, 40], [9, 40], [4, -r + 62], [-4, -r + 62]], 6, 1), RED, 5); x.restore();
  piece(() => circ(cx, cy, 24, 7, 14), INK, 3);
}

// Stop 1: twelve day tiles. 11.6 days means eleven full and one 0.6 full.
function days(g) {
  const cols = 4, w = 196, h = 150, gx = 214, gy = 166, x0 = ART.cx - gx * 1.5, y0 = ART.y + 118;
  sheet(90, ART.y + 8, 990, ART.y + 616, CARD2, 12, 12, 3); tape(120, ART.y + 14, -.5); tape(960, ART.y + 14, .5);
  for (let i = 0; i < 12; i++) {
    const k = pop(g.since, .35 + i * .16, .16), cx = x0 + (i % cols) * gx, cy = y0 + Math.floor(i / cols) * gy;
    tile(cx, cy, w, h, (i < 11 ? 1 : .6) * k, 20 + i);
    T(num(i + 1), cx, cy + 26, 72, 800, k > .5 ? CARD : MUTE, 'center', 180);
  }
}

// Stop 2: one tile a year, and a person who grows as they fill.
function years(g) {
  const cols = 8, w = 74, h = 74, gx = 86, gy = 86, x0 = 96 + w / 2, y0 = ART.y + 112;
  sheet(70, ART.y + 8, 1010, ART.y + 616, CARD2, 13, 12, 3); tape(100, ART.y + 14, -.5); tape(980, ART.y + 14, .5);
  const run = clamp((g.since - .35) / 3) * 31.7;
  for (let i = 0; i < 32; i++) tile(x0 + (i % cols) * gx, y0 + Math.floor(i / cols) * gy, w, h, clamp(run - i), 40 + i);
  T(`Age ${num(Math.floor(run))}`, 400, ART.y + 548, 56, 800, INK, 'center', 500);
  icon.person(888, ART.y + 570, lerp(120, 400, clamp(run / 20)), INK, 5);
}

// Stop 3: an Ice Age morning. The mammoth is a few polygons, stepping on the spot.
function mammoth(g) {
  const k = pop(g.since, .3, .35), cx = ART.cx, by = ART.y + 590, step = Math.floor(g.t * 4) % 2;
  sheet(70, ART.y + 8, 1010, ART.y + 616, SKY, 14, 12, 3); tape(100, ART.y + 14, -.5); tape(980, ART.y + 14, .5);
  piece(() => poly([[86, by + 10], [86, by - 90], [260, by - 170], [430, by - 110], [640, by - 200], [840, by - 120], [994, by - 170], [994, by + 10]], 4, 4), CARD, 6);
  for (let i = 0; i < 26; i++) { const sx = 110 + hash(i * 3.3) * 860, sy = ART.y + 40 + ((hash(i * 7.1) * 520 + g.t * 60) % 520); piece(() => circ(sx, sy, 5 + hash(i) * 6, i, 8), CARD, 1); }
  x.save(); x.translate(cx, by - 60 + (1 - k) * 200); x.scale(1.45, 1.45);
  for (const [lx, up] of [[-120, step], [-66, 1 - step], [52, step], [106, 1 - step]]) piece(() => rect(lx, -8 - up * 6, 44, 100, 0, lx, 2), '#5A3A1E', 3);
  piece(() => poly([[-150, -40], [-158, -120], [-110, -176], [-30, -196], [50, -176], [120, -190], [168, -150], [176, -96], [150, -50], [60, -30], [-60, -30]], 8, 2), '#7A5230', 6);
  piece(() => poly([[150, -150], [212, -150], [236, -96], [232, -30], [246, 20], [214, 26], [196, -30], [176, -66]], 9, 2), '#7A5230', 4);
  piece(() => poly([[176, -70], [222, -52], [268, -66], [300, -112], [310, -104], [284, -44], [224, -24], [170, -44]], 11, 1), CARD, 3);
  piece(() => circ(186, -130, 7, 12, 8), INK, 0);
  x.restore();
}

PAPER.reel({
  theme: 'teal', ground: 'town', locale: 'en-US',
  hook: ['How long is', 'a billion seconds?'],
  hookNum: { from: 60, to: 1000000000, dur: 2.4, log: true, unit: 'seconds' },
  hookArt: stopwatch,
  stops: [
    { name: 'A million seconds is about', val: 11.6, dec: 1, unit: 'days', fact: ['1,000,000 ÷ 86,400 seconds in a day', 'Not even two weeks.'], labels: 2, art: days },
    { name: 'A billion seconds is about', val: 31.7, dec: 1, unit: 'years', fact: ['1,000,000,000 ÷ 31,557,600 seconds in a year', 'A billion seconds old: you are nearly 32.'], labels: 2, art: years },
    { name: 'A trillion seconds is about', val: 31700, unit: 'years', fact: ['That long ago, the world was in an Ice Age.', 'Writing is only about 5,000 years old.'], art: mammoth },
  ],
  end: ['Million, billion, trillion.', 'They sound alike.', 'They are nowhere close.'], cta: 'Send this to a friend',
  endArt(g) {
    // True to scale: if a trillion is 800 px, a billion is 0.8 px and a million is 0.0008 px.
    const x0 = 140, len = 800, top = ART.y + 40, bar = pop(g.since, .3, .5);
    T('The same three, to scale', CX, top, 54, 800, CARD, 'center', 860);
    T('trillion', x0, top + 120, 48, 800, CARD, 'left', 700);
    piece(() => rect(x0 + len * bar / 2, top + 182, len * bar + 2, 66, 0, 30, 2), RED, 5);
    if (g.since > 1) { T('billion', x0, top + 310, 48, 800, CARD, 'left', 700); x.fillStyle = GOLD; x.fillRect(x0, top + 342, 1, 66); T('under one pixel wide here', x0 + 26, top + 388, 38, 600, CARD, 'left', 760); }
    if (g.since > 1.8) { T('million', x0, top + 490, 48, 800, CARD, 'left', 700); T('a thousand times thinner again', x0, top + 552, 38, 600, CARD, 'left', 800); }
  },
  cues: SCH => [...Array(9)].map((_, i) => ({ t: .2 + i * .5, k: i % 2 ? 'tock' : 'tick' })).concat(
    [...Array(12)].map((_, i) => ({ t: SCH[0].arr + .35 + i * .16, k: 'digit' })), [{ t: SCH[2].arr + .3, k: 'drop' }]),
});
</script>
</body></html>
