<script type="module">
// X-ray Cutaway: the shell turns to blue glass so hidden parts show, parts glow, thin leader lines tie them to label boxes.
// Dark navy room, round plinth with a gold rim, sphere smoke. Use it to explain how a thing works inside.
import * as THREE from 'three';
import { EffectComposer } from './_shared/vendor/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from './_shared/vendor/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from './_shared/vendor/jsm/postprocessing/UnrealBloomPass.js';
import { OutputPass } from './_shared/vendor/jsm/postprocessing/OutputPass.js';
import { RoomEnvironment } from './_shared/vendor/jsm/environments/RoomEnvironment.js';
import { rickshaw3d, softDisc, gradientTex } from './_shared/rick3d.js';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('v'), antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1); r.setSize(W, H, false); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.1;
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(30, W / H, .1, 200);
scene.background = gradientTex([[0, '#081420'], [.45, '#0c2030'], [.72, '#1d3648'], [1, '#3d5668']]);
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), .04).texture; scene.environmentIntensity = .5;
const composer = new EffectComposer(r, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, cam)); composer.addPass(new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), .4, .55, .82)); composer.addPass(new OutputPass());
const key = new THREE.DirectionalLight('#dbe9f6', 1.6); key.position.set(-3, 7, 6); scene.add(key);
const lead = document.getElementById('lead').getContext('2d'), $ = id => document.getElementById(id);
let RKT, pipes = [], beads = [], anchors = [], puffsM = [], jets = [];
const glow = c => new THREE.MeshBasicMaterial({ color: new THREE.Color(...c), toneMapped: false });
function parts(G) {
  // what the glass reveals; coordinates are rickshaw units, origin on the ground
  const steel = new THREE.MeshStandardMaterial({ color: '#c9d3dc', metalness: .85, roughness: .28 }), gold = new THREE.MeshStandardMaterial({ color: '#e8b65a', metalness: .9, roughness: .3, emissive: '#7a4f12', emissiveIntensity: .9 });
  [-.32, .32].forEach(z => { const k = new THREE.Mesh(new THREE.CapsuleGeometry(.13, .72, 10, 22), steel); k.rotation.z = Math.PI / 2; k.position.set(-.34, .62, z); G.add(k); });
  const valve = new THREE.Mesh(new THREE.CylinderGeometry(.09, .09, .22, 22), gold); valve.position.set(.1, .54, 0); G.add(valve);
  const line = pts => { const c = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(...p))); G.add(new THREE.Mesh(new THREE.TubeGeometry(c, 70, .022, 10), glow([.16, 1.5, 1.7]))); pipes.push(c); return c; };
  line([[.06, .62, .32], [.1, .6, .16], [.1, .54, 0]]); line([[.06, .62, -.32], [.1, .6, -.16], [.1, .54, 0]]);
  line([[.1, .54, 0], [.5, .46, 0], [.95, .4, 0], [1.26, .3, 0], [1.28, .03, 0]]);
  line([[.1, .54, 0], [-.3, .38, .3], [-.68, .24, .62], [-.7, .03, .66]]); line([[.1, .54, 0], [-.3, .38, -.3], [-.68, .24, -.62], [-.7, .03, -.66]]);
  RKT.jets.forEach(p => { const n = new THREE.Mesh(new THREE.ConeGeometry(.09, .14, 20), gold); n.position.set(p.x, p.y + .05, p.z); G.add(n); });
  const bead = new THREE.SphereGeometry(.03, 12, 10), bm = glow([2.2, 2.6, 2.6]); pipes.forEach(() => { for (let i = 0; i < 4; i++) { const m = new THREE.Mesh(bead, bm); G.add(m); beads.push(m); } });
  anchors = [new THREE.Vector3(-.12, .72, .32), new THREE.Vector3(.1, .62, 0), new THREE.Vector3(1.28, .06, 0)];
}
async function setup() {
  const glass = (c, o = .24) => new THREE.MeshPhysicalMaterial({ color: c, transparent: true, opacity: o, roughness: .22, metalness: .1, side: THREE.DoubleSide, depthWrite: false });
  const edge = glass('#5fa6e8', .22);
  RKT = rickshaw3d({ wedges: ['#2f6fc4', '#4a8fe0', '#2f6fc4', '#4a8fe0'].map(c => glass(c)), inner: edge, cushion: glass('#7db4ea', .2), box: glass('#3f86d8', .26), saddle: glass('#a7c9ea', .4), metal: new THREE.MeshStandardMaterial({ color: '#8fb0cc', metalness: .7, roughness: .35, transparent: true, opacity: .75 }), tire: new THREE.MeshStandardMaterial({ color: '#0a0c10', roughness: .6 }), hub: new THREE.MeshStandardMaterial({ color: '#46586a', metalness: .8, roughness: .4 }) }, { wheelSeg: 56, tire: .07, spokes: 10, bevel: .02, tubeR: .026, tubeSeg: 10, hoodSeg: 12 });
  RKT.group.scale.setScalar(1.14); RKT.group.rotation.y = -.42; scene.add(RKT.group); parts(RKT.group);
  // plinth
  const top = new THREE.Mesh(new THREE.CylinderGeometry(4.3, 4.3, .3, 120), new THREE.MeshStandardMaterial({ color: '#4d6274', metalness: .35, roughness: .5 })); top.position.y = -.15; scene.add(top);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(4.3, .035, 10, 200), new THREE.MeshStandardMaterial({ color: '#d9a84e', emissive: '#8a5f18', emissiveIntensity: 1, metalness: .8, roughness: .3 })); rim.rotation.x = Math.PI / 2; scene.add(rim);
  const sg = new THREE.SphereGeometry(1, 22, 16), sm = new THREE.MeshStandardMaterial({ color: '#a9bccb', roughness: .42, metalness: .1 });
  for (let i = 0; i < 54; i++) { const s = new THREE.Mesh(sg, sm); s.visible = false; scene.add(s); puffsM.push(s); }
  const jt = softDisc(128, [[0, 1], [.4, .55], [1, 0]]); RKT.jets.forEach(() => { const j = new THREE.Sprite(new THREE.SpriteMaterial({ map: jt, color: '#bfefff', transparent: true, opacity: .8, blending: THREE.AdditiveBlending, depthWrite: false })); RKT.group.add(j); jets.push(j); });
}
const v = new THREE.Vector3(), toScreen = (p, g) => { v.copy(p); g.localToWorld(v); v.project(cam); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
const BOX = [['l0', 'bottom'], ['l1', 'bottom'], ['l2', 'top']], SHOW = [.5, 1, 2.5];
function draw(t) {
  const lift = BEAT.lift(t), ign = BEAT.ign(t), [sx, sy] = shakeXY(t, .03), G = RKT.group;
  G.position.set(sx + .05, .02 + lift * 2.05 + sy, 0); G.rotation.z = .04 * lift;
  RKT.wheels.forEach(w => { w.rotation.z = -t * 5 * ign; });
  jets.forEach((j, i) => { const p = RKT.jets[i], L = (.15 + .55 * ign) * (.9 + .2 * vnoise(t * 24 + i * 4)); j.position.set(p.x, p.y - L * .9, p.z); j.scale.set(.2, L * 2.1, 1); j.visible = ign > .03; });
  const flow = ss(.7, 1.6, t); beads.forEach((b, n) => { const c = pipes[n >> 2], u = (t * .55 + (n & 3) / 4) % 1; c.getPoint(u, b.position); b.visible = flow > .05; b.scale.setScalar(flow); });
  puffsM.forEach(s => s.visible = false);
  puffs(t, { n: 54, t1: 4.8, life: [1.6, 3.2], spread: 3.1, rise: -.25, fall: -1.7, r: [.06, .18], emit: (i, b) => { const j = RKT.jets[i % 3]; return [j.x * 1.14, .06 + BEAT.lift(b) * 2.05]; } }).forEach((p, k) => { const s = puffsM[k]; s.visible = true; s.position.set(p.x, Math.max(.1, p.y), lerp(-1.4, 1.6, hash(p.i * 1.3))); s.scale.setScalar(p.r); });
  const a = lerp(.1, -.14, ss(0, DUR, t)), R = 13.2, ty = 1.35 + lift * 1.15; cam.position.set(Math.sin(a) * R, 2.9 + lift * .8, Math.cos(a) * R); cam.lookAt(.1, ty, 0);
  G.updateMatrixWorld(true); cam.updateMatrixWorld(); composer.render();
  // labels and leaders follow the part they name
  lead.clearRect(0, 0, W, H);
  BOX.forEach(([id, side], i) => {
    const k = ss(SHOW[i], SHOW[i] + .35, t), el = $(id); el.style.opacity = k; if (k <= 0) return;
    const [ax, ay] = toScreen(anchors[i], G), bx = el.offsetLeft + el.offsetWidth / 2, by = side === 'bottom' ? el.offsetTop + el.offsetHeight : el.offsetTop, u = k;
    lead.strokeStyle = '#c9d7e2'; lead.lineWidth = 2; lead.beginPath(); lead.moveTo(bx, by); lead.lineTo(lerp(bx, ax, u), lerp(by, ay, u)); lead.stroke();
    lead.fillStyle = '#e8b65a'; lead.beginPath(); lead.arc(ax, ay, 7 * k, 0, 7); lead.fill();
  });
  $('cap').style.opacity = BEAT.caption(t);
}
boot({ dur: 7, cues: [...LIFT_CUES, { t: .5, k: 'tick' }, { t: 1, k: 'tick' }, { t: 2.5, k: 'tick' }], setup, draw, fonts: ['700 40px Noto', '400 32px Noto', '700 60px Noto'] });
</script>
