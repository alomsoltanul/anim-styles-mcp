const plastic = c => new THREE.MeshStandardMaterial({ color: c, roughness: .36 });
let car, wheels = [], fig, armL, armR, pops = [];

function setup() {
  const S = new Set_(), N = 64, D = 104, Z0 = -48;
  S.brick(-N / 2, -.4, Z0, N, D, 'lime', .4, false);
  // stud field
  { const M = new THREE.Matrix4(), g = new THREE.InstancedMesh(studG, plastic(COL.lime), N * D); let k = 0; for (let i = 0; i < N; i++) for (let j = 0; j < D; j++) { M.makeTranslation(-N / 2 + i + .5, .09, Z0 + j + .5); g.setMatrixAt(k++, M); } g.receiveShadow = g.castShadow = true; g.frustumCulled = false; scene.add(g); }

  for (let x = -14; x < 14; x += 2) { S.brick(x, 0, 7, 2, 1, 'orange', .4); S.brick(x, 0, -8, 2, 1, 'orange', .4); }

  C.brick(-7, 2.8, -3, 8, 1, 'red'); C.brick(-7, 2.8, 2, 8, 1, 'red'); C.brick(-7, 2.8, -2, 1, 4, 'red');
  C.brick(-6, 2.8, -2, 7, 4, 'white', BH, true);

  rows.forEach(([x, w, c], i) => { const last = i === rows.length - 1 || i === rows.length - 2; if (last) { C.brick(x, y, -3, w, 6, c, BH, i === rows.length - 1); } else { C.brick(x, y, -3, w, 1, c, BH, false); C.brick(x, y, 2, w, 1, c, BH, false); C.brick(x, y, -2, 1, 4, c, BH, false); } y += BH; });
  // beam to the front fork, saddle, bars
  for (let x = 1; x < 9; x += 2) C.brick(x, 2.4, -1, 2, 2, 'dark', .4);
  C.brick(3, 2.8, -1, 2, 2, 'dark', BH * 2, false); C.brick(2, 5.2, -1, 4, 2, 'black', .4);
  C.brick(8, 2.8, -1, 2, 2, 'yellow', BH); C.brick(8, 4, -1, 2, 2, 'yellow', BH); C.brick(8, 5.2, -1, 2, 2, 'yellow', BH, false); C.brick(8, 6.4, -4, 2, 8, 'black', .4);

  const tireG = new THREE.CylinderGeometry(1, 1, 1, 40); tireG.rotateX(Math.PI / 2);
  const wheel = (x, y, z, R, wdt) => { const g = new THREE.Group(); const a = new THREE.Mesh(tireG, plastic(COL.black)); a.scale.set(R, R, wdt); const b = new THREE.Mesh(tireG, plastic('#f2f2f2')); b.scale.set(R * .55, R * .55, wdt + .12); const c = new THREE.Mesh(tireG, plastic(COL.red)); c.scale.set(R * .18, R * .18, wdt + .22); [a, b, c].forEach(m => { m.castShadow = true; g.add(m); }); g.position.set(x, y, z); car.add(g); wheels.push(g); };
  wheel(-3.4, 2.1, -3.7, 2.1, 1); wheel(-3.4, 2.1, 3.7, 2.1, 1); wheel(9, 1.8, 0, 1.8, 1.2);
  scene.add(car);
  // toy figure: a plain peg doll, block body, ball head and hands
  fig = new THREE.Group(); const skin = plastic('#e9b887'), red = plastic('#c9151c'), blu = plastic('#1e5aa8');
  const add = (g, m, x, y, z, p = fig) => { const q = new THREE.Mesh(g, m); q.position.set(x, y, z); q.castShadow = true; p.add(q); return q; };
  add(new THREE.BoxGeometry(2.2, 2.4, 1.3), blu, 0, 1.2, 0); add(new THREE.BoxGeometry(2.2, 2.3, 1.3), red, 0, 3.55, 0);
  const faceC = document.createElement('canvas'); faceC.width = 512; faceC.height = 256; { const x = faceC.getContext('2d'); x.fillStyle = '#e9b887'; x.fillRect(0, 0, 512, 256); x.fillStyle = '#16140f'; const cx = 256; x.beginPath(); x.arc(cx - 26, 112, 9, 0, 7); x.arc(cx + 26, 112, 9, 0, 7); x.fill(); x.lineWidth = 7; x.strokeStyle = '#16140f'; x.beginPath(); x.arc(cx, 128, 32, .25, 2.9); x.stroke(); }

  const arm = s => { const p = new THREE.Group(); p.position.set(s * 1.4, 4.45, 0); add(new THREE.BoxGeometry(.6, 1.7, .66), red, 0, -.75, 0, p); add(new THREE.SphereGeometry(.42, 16, 12), skin, 0, -1.8, 0, p); fig.add(p); return p; };
